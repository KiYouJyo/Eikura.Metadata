name: Metadata runtime package

on:
  push:
    branches:
      - "codex/metadata-runtime-release"
      - "codex/metadata-runtime-0.2.1"
      - "codex/metadata-runtime-0.2.3"
      - "codex/metadata-runtime-0.2.4"
      - "codex/metadata-runtime-0.2.8"
      - "codex/metadata-runtime-0.2.9"
      - "codex/metadata-runtime-0.2.10"
      - "codex/metadata-runtime-0.2.11"
      - "codex/metadata-runtime-0.2.12"
      - "codex/metadata-runtime-0.2.13"
      - "codex/metadata-runtime-0.2.14"
      - "codex/metadata-runtime-0.2.15"
      - "codex/metadata-runtime-0.2.16"
      - "codex/metadata-runtime-0.2.17"
      - "codex/metadata-runtime-0.2.18"
      - "codex/metadata-runtime-0.2.19"
      - "codex/metadata-runtime-0.2.20"
      - "codex/metadata-runtime-0.2.23"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metadata-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Eizo.Metadata.slnx

      - name: Build and test
        run: |
          dotnet build Eizo.Metadata.slnx --configuration Release --no-restore
          dotnet test Eizo.Metadata.slnx --configuration Release --no-build

      - name: Build unified Metadata runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.2.23'
          $root = Join-Path $env:RUNNER_TEMP "Eizo.Metadata.Runtime-v$version-x64"
          $bin = Join-Path $root 'bin'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'metadata-module-build'
          New-Item -ItemType Directory -Force -Path $bin,$buildRoot | Out-Null

          # Every product module under src/Eizo.Metadata.* shares one update boundary.
          # Recognition remains usable offline; provider availability never controls
          # whether the Recognition assembly can load.
          $projects = @(Get-ChildItem 'src' -Directory | ForEach-Object {
            Get-ChildItem $_.FullName -Filter 'Eizo.Metadata.*.csproj' -File
          } | Sort-Object FullName)
          if ($projects.Count -eq 0) { throw 'No Eizo.Metadata runtime projects were found.' }

          foreach ($project in $projects) {
            $moduleOutput = Join-Path $buildRoot $project.BaseName
            New-Item -ItemType Directory -Force -Path $moduleOutput | Out-Null
            dotnet build $project.FullName --configuration Release --no-restore --output $moduleOutput
            if ($LASTEXITCODE -ne 0) { throw "Metadata module build failed: $($project.FullName)" }
            Get-ChildItem $moduleOutput -File -Filter '*.dll' | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $bin $_.Name) -Force
            }
          }

          $anchor = Join-Path $bin 'Eizo.Metadata.Recognition.dll'
          if (-not (Test-Path $anchor)) { throw 'Metadata Recognition anchor assembly was not produced.' }
          $modules = @(Get-ChildItem $bin -File -Filter 'Eizo.Metadata*.dll' |
            ForEach-Object BaseName | Sort-Object -Unique)
          if ($modules -notcontains 'Eizo.Metadata.Recognition') { throw 'Recognition module is missing from Metadata runtime.' }

          $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName($anchor).Version
          $abiVersion = "{0}.{1}.{2}" -f $assemblyVersion.Major, $assemblyVersion.Minor, [Math]::Max(0, $assemblyVersion.Build)

          $manifest = [ordered]@{
            schemaVersion = 1
            # Eizo 0.3.6 keeps this technical identity for on-disk compatibility.
            # The user-facing component and release unit are Eizo.Metadata.
            component = 'Eizo.Recognition'
            version = $version
            abiVersion = $abiVersion
            tag = "v$version"
            commit = '${{ github.sha }}'
            runtime = 'x64'
            framework = 'net10.0'
            sourceRepository = 'KiYouJyo/Eizo.Metadata'
            modules = $modules
            hostContract = [ordered]@{
              name = 'Eizo.Recognition.Host'
              minVersion = '1.0.0'
              maxVersionExclusive = '2.0.0'
            }
          }
          $manifestPath = Join-Path $root 'eizo-recognition-release.json'
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM

          # Keep Eizo 0.3.6 technical asset names stable. Later host-contract revisions
          # can migrate the internal identity without breaking installed 0.3.6 hosts.
          $zip = Join-Path $env:RUNNER_TEMP "Eizo.Recognition.Runtime-v$version-x64.zip"
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal

          $extract = Join-Path $env:RUNNER_TEMP 'metadata-runtime-verify'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          foreach ($required in @('eizo-recognition-release.json', 'bin/Eizo.Metadata.Recognition.dll')) {
            if (-not (Test-Path (Join-Path $extract $required))) { throw "Runtime archive missing: $required" }
          }
          foreach ($module in $modules) {
            if (-not (Test-Path (Join-Path $extract "bin/$module.dll"))) { throw "Metadata module missing from archive: $module" }
          }

          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $env:RUNNER_TEMP 'eizo-recognition-release.json') -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "Unified Metadata runtime package PASS: modules=$($modules -join ', '); ABI=$abiVersion"

      - name: Upload Metadata runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: Eizo-Metadata-runtime-v0.2.23-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Eizo.Recognition.Runtime-v0.2.23-x64.zip
            ${{ runner.temp }}/eizo-recognition-release.json
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Metadata runtime v0.2.23
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.23 >/dev/null 2>&1; then
            echo 'Eizo.Metadata v0.2.23 already exists; leaving the published release immutable.'
            exit 0
          fi
          gh release create v0.2.23 \
            --target "${GITHUB_SHA}" \
            --title "Eizo.Metadata v0.2.23" \
            --notes "TMDB general-media details release. v0.2.23 adds genres, runtime, status, language, origin countries, production companies, cast and crew to resolved TMDB subjects while keeping the stable 0.1 host ABI." \
            "${RUNNER_TEMP}/Eizo.Recognition.Runtime-v0.2.23-x64.zip" \
            "${RUNNER_TEMP}/eizo-recognition-release.json" \
            "${RUNNER_TEMP}/SHA256SUMS.txt"
